# =============================================================================
# IssueFlow - Continuous Integration (CI) Workflow
# Automated testing and build verification on push and pull requests
# =============================================================================

name: IssueFlow CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Backend CI: Python 3.12 + Pytest Suite
  # ===========================================================================
  backend-ci:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade Pip and Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key-never-use-in-production-1234567890
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          INITIAL_ADMIN_EMAIL: admin@issueflow.com
          INITIAL_ADMIN_PASSWORD: Admin@123
          GEMINI_API_KEY: mock_ci_gemini_key_for_testing
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          pytest backend/tests -v

  # ===========================================================================
  # Frontend CI: Node.js 20 + Vitest + TypeScript + Vite Build
  # ===========================================================================
  frontend-ci:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Clean Install NPM Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Validate TypeScript Types
        run: npx tsc -b

      - name: Build Production Frontend Bundle
        env:
          VITE_API_BASE_URL: https://api.issueflow.example.com
        run: npm run build

